[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "damlforge-fuzz"
version = "0.1.0"
description = "A fuzzer for the DamlForge compiler, forge"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ruslan Glaznyov", email = "ruslan.glaznyov@gmail.com" }]
maintainers = [{ name = "Noders Team" }]
requires-python = ">=3.11"
dependencies = ["damlforge", "pyyaml"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
damlforge-fuzz = "damlforge_fuzz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A warning that escapes compile_and_sort fails a test, and the seeds must still
# sort OK under this filter.
filterwarnings = ["error"]
