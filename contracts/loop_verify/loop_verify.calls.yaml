# The calls that `run --compare` makes on each input of loop_verify.vy.
# In the second call, one contract has another issuer, so the assert fails.
- choice: Iou.Sum
  contract: {issuer: alice, owner: bob, amount: "1.0"}
  args:
    cids:
      - {create: Iou, with: {issuer: alice, owner: bob, amount: "2.0"}}
      - {create: Iou, with: {issuer: alice, owner: stop, amount: "3.5"}}
- choice: Iou.Sum
  contract: {issuer: alice, owner: bob, amount: "1.0"}
  args:
    cids:
      - {create: Iou, with: {issuer: alice, owner: bob, amount: "2.0"}}
      - {create: Iou, with: {issuer: bob, owner: alice, amount: "3.5"}}
